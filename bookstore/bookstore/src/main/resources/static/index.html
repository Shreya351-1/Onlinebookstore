<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>GraspMaster</title>

<style>
:root{
--bg:#f3f3f3;
--text:black;
--card:white;
}

.dark{
--bg:#131921;
--text:white;
--card:#1f2a38;
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
}

/* HEADER */
.header{
display:flex;
align-items:center;
justify-content:space-between;
background:#131921;
color:white;
padding:10px 20px;
}

.logo{
display:flex;
align-items:center;
gap:10px;
}

.logo img{
height:40px;
}

.search{
width:40%;
padding:8px;
border:none;
border-radius:5px;
}

.right{
display:flex;
align-items:center;
gap:15px;
}

.user-area a{
background:#ffd814;
padding:6px 12px;
border-radius:6px;
text-decoration:none;
color:black;
font-weight:bold;
}

.user-area button{
background:#ff4d4d;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

/* CART */
.cart{
position:relative;
cursor:pointer;
}

.badge{
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
border-radius:50%;
padding:3px 7px;
font-size:12px;
}

/* GRID */
.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;
}

/* CARD */
.card{
position:relative;
background:var(--card);
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 6px rgba(0,0,0,.1);
transition:0.2s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
height:170px;
object-fit:cover;
}

/* BEST SELLER */
.badge-book{
position:absolute;
top:10px;
left:10px;
background:#e41f11;
color:white;
padding:4px 8px;
border-radius:5px;
font-size:12px;
font-weight:bold;
}

/* PRICE */
.price{
color:#b12704;
font-weight:bold;
}

/* BUTTON */
button{
background:#ffd814;
border:none;
padding:8px;
margin-top:8px;
cursor:pointer;
border-radius:6px;
}

/* RATING */
.rating{
color:#f0a500;
font-weight:bold;
margin:8px 0;
}

/* TOAST */
.toast{
position:fixed;
bottom:20px;
right:20px;
background:green;
color:white;
padding:10px;
border-radius:5px;
display:none;
}
</style>

</head>

<body>

<div class="header">
<div class="logo">

<h2>Knowledge Store</h2>
</div>

<input class="search" placeholder="Search books..." onkeyup="searchBooks(this.value)">

<div class="right">
<div id="userArea" class="user-area"></div>

<div class="cart" onclick="goCart()">
🛒 <span class="badge" id="count">0</span>
</div>

<button onclick="toggleTheme()">🌙</button>

</div>
</div>

<div class="container" id="books"></div>

<div class="toast" id="toast">Added to Cart ✅</div>

<script>

let allBooks=[];

/* THEME */
let dark=localStorage.getItem("theme")==="dark";
if(dark){
document.body.classList.add("dark");
document.getElementById("logo").src="logoBW.png";
}

function toggleTheme(){
dark=!dark;
document.body.classList.toggle("dark");
localStorage.setItem("theme",dark?"dark":"light");
document.getElementById("logo").src=
dark?"logoBW.png":"logoNO.png";
}

/* LOGIN */
function checkLogin(){
let loggedIn=localStorage.getItem("loggedIn");

if(loggedIn==="true"){
let user=localStorage.getItem("currentUser");
document.getElementById("userArea").innerHTML=
`👤 <b>${user}</b>
<button onclick='logout()'>Logout</button>`;
}
else{
document.getElementById("userArea").innerHTML=
`<a href='login.html'>Login</a>`;
}
}

function logout(){
localStorage.removeItem("loggedIn");
localStorage.removeItem("currentUser");
location.reload();
}

checkLogin();

/* FETCH */
fetch('/books')
.then(r=>r.json())
.then(data=>{
allBooks=data;
displayBooks(data);
});

/* DISPLAY */
function displayBooks(books){
let html='';

books.forEach(b=>{
html+=`
<div class='card'>

${b.rating>=4.8 ?
'<div class="badge-book">Best Seller</div>' : ''}

<img src='${b.image}'>

<h4>${b.title}</h4>
<p>${b.author}</p>

<p class='rating'>
⭐ ${b.rating || 4.5}
</p>

<p class='price'>₹${b.price}</p>

<button onclick='addToCart(${b.id})'>
Add to Cart
</button>

</div>`;
});

document.getElementById('books').innerHTML=html;
}

/* SEARCH */
function searchBooks(text){
let f=allBooks.filter(
b=>b.title.toLowerCase().includes(text.toLowerCase())
);
displayBooks(f);
}

/* CART */
function addToCart(id){

let loggedIn=localStorage.getItem('loggedIn');

if(loggedIn!=="true"){
showToast('Login required!');
setTimeout(()=>location.href='login.html',1000);
return;
}

let book=allBooks.find(b=>b.id===id);

let cart=JSON.parse(localStorage.getItem('cart'))||[];

let existing=cart.find(b=>b.id===id);

if(existing){
existing.qty++;
}else{
book.qty=1;
cart.push(book);
}

localStorage.setItem('cart',JSON.stringify(cart));

updateCart();
showToast('Added to Cart ✅');
}

/* CART COUNT */
function updateCart(){
let cart=JSON.parse(localStorage.getItem('cart'))||[];
let count=cart.reduce((s,b)=>s+(b.qty||1),0);
document.getElementById('count').innerText=count;
}

/* NAV */
function goCart(){
location.href='cart.html';
}

/* TOAST */
function showToast(msg){
let t=document.getElementById('toast');
t.innerText=msg;
t.style.display='block';
setTimeout(()=>t.style.display='none',1500);
}

updateCart();

</script>

</body>
</html>
